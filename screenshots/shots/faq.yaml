  - id: saved-comment-icon
    page: faq/annotations
    file: saved-comment-icon
    url: http://dodona.localhost:3000/{locale}/courses/29/
    user: 1 # zeus
    state: [faq-cast, faq-annotated-submission, faq-annotations-content]
    hook: hooks/faq-saved-comment-icon.mjs
    crop:
      selector: '[data-shot="saved-comment-icon"]'
    must_show:
      - saved-comment bookmark icon in the annotation header
    # Pair: NL "Je leraar", "Reageer...".

  - id: edit-saved-comment
    page: faq/annotations
    file: edit-saved-comment
    url: http://dodona.localhost:3000/{locale}/courses/29/
    user: 1 # zeus
