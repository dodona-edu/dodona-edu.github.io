  - id: all-questions-page
    page: faq/annotations
    file: all-questions-page
    url: http://dodona.localhost:3000/{locale}/questions/
    user: 1 # zeus
    keepNavbar: true # the drawer toggle lives in the navbar
    state: [faq-annotated-submission, faq-annotations-content]
    hook: hooks/faq-all-questions-page.mjs
    crop:
      union: ['#drawer', '.card:has(#questions-table-wrapper)']
    must_show:
      - sidebar Questions entry
      - question list with course names
    # Seeded lorem rows from courses 1-4 are hidden via CSS in the hook rather than
