  # ---------------------------------------------------------------------------------

  - id: my-profile
    page: faq/api-tokens
    file: my-profile
    url: http://dodona.localhost:3000/{locale}/
    user: 5 # Sofie -- a plain student is the right cast, no name neutralisation needed
    keepNavbar: true
