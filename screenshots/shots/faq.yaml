      - '"Questions are enabled. Disable them." banner'

  - id: course-card-questions
    page: faq/annotations
    file: course-card-questions
    url: http://dodona.localhost:3000/{locale}/
    user: 1 # zeus
    state: [faq-annotated-submission, faq-annotations-content]
    hook: hooks/faq-course-card-questions.mjs
    crop:
      selector: '[data-shot="course-card-questions"]'
    must_show:
