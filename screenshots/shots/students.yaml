# Student-guide screenshot manifest. Converted from the Phase 4 research doc
# (manifest-students.md) into the checked-in capture-system format described in
# ../README.md. Nothing here has been captured yet -- this file drives the upcoming capture
# chunks (`node screenshots/capture.mjs --area students ...`).
#
# Stages D/E (course 29 exercise/submission shots) additionally need the
# course29-repo-access scenario applied (see ../state/), or activity pages 403.
#
# Hand-in flow: confirmed LEGACY (capture-decisions.md "Students" #1) -- production students
# still see the tabbed `Hand in / Submissions / Feedback` card, so every exercise/feedback
# shot below targets `.card.card-nav` and its tabs, not the new-flow selectors.
#
# Selector confidence: selectors quoted verbatim from the manifest (e.g. `.activities-table`,
# `.card.card-nav`, `#main-container`, `.alert-warning`, `td.actions`, `.group.card`,
# `a.link-card[href$="/courses/"]`) are high confidence. Selectors built from the manifest's
# prose descriptions only ("the globe", "the user chip", "the callout") go through
# hooks/students-interact.mjs's text-matching helpers (`highlight`, `tagClosest`) and are
# best-effort -- verify against the live dev instance before trusting a capture run.
#
# ORDERING (see also each state/students-*.setup.rb):
#   1. Stage A/B/C (signed-out, novice, profile) -- no course-29 state, any order.
#   2. students-series-deadlines.setup.rb, then Stage D (EN pass) D1-D6 (homepage/course
#      shots) BEFORE D9-D15 (which create throwaway submissions/annotations/questions that
#      would otherwise pollute "Recent exercises", progress bars and counts).
#   3. students-course29-dutch.setup.rb -- ONLY after the full EN pass above -- then Stage E
#      repeats D1-D16 on /nl/... with the -nl state variants (students-teacher-annotation-nl,
#      students-question-posted-nl).
#   4. students-course29-dutch.teardown.rb and students-series-deadlines.teardown.rb, in that
#      order, once Stage E is fully captured.
#   5. Stage F (icon crops) last, on the now-clean seeded state, using its own self-contained
#      students-icons-past-deadline scenario for the 2 deadline-dependent icons.
#
# Throwaway submissions/annotations/questions (D10, D14b, D14c, D14d-fallback, D15) are each
# destroyed right after their shot in a given locale pass, and independently recreated for
# the other locale pass (their own scenario's setup/teardown pair is reused for both passes,
# except D15's teacher-annotation and question-posted scenarios which have distinct -en/-nl
# variants since their text differs by locale).

area: students
defaults:
  user: 5
  viewport: { width: 1440, height: 1000 }

shots:
  # ---------------------------------------------------------------------------------------
  # Stage A -- signed-out shots. No course-29 state. capture.mjs always signs in as
  # `user` before a hook runs, so every shot here uses `signOut: true` to undo that.
  # ---------------------------------------------------------------------------------------

  - id: language-menu
    page: guides/students/login-and-settings
    file: language-menu
    url: /{locale}/
    keepNavbar: true
    hook: hooks/students-interact.mjs
    signOut: true
    openLanguageMenu: true
    highlight:
      - selector: '.dropdown-menu.show' # best-effort: Bootstrap dropdown convention, not confirmed live
    crop:
      clip: { x: 880, y: 0, width: 560, height: 220 } # viewport 1440 wide; dropdown overlays the page
    must_show:
      - globe icon showing the current locale
      - open dropdown listing English / Nederlands
      - highlight box around the open menu
    notes: NAVBAR shot (menu anchors to the navbar corner).

  - id: sign-in-button
    page: guides/students/login-and-settings
    file: sign-in-button
    url: /{locale}/
    keepNavbar: true
    hook: hooks/students-interact.mjs
    signOut: true
    highlight:
      - text: 'Sign in'
        scope: '.dodona-navbar'
      - text: 'Sign in'
        scope: '#main-container'
    crop:
      clip: { x: 0, y: 0, width: 1440, height: 620 }
    must_show:
      - '"Learn to code" hero'
      - both Sign in affordances highlighted (navbar link + hero button)
      - no dev banner, no environment pill
    notes: NAVBAR shot. NL pass highlight text becomes "Aanmelden" -- verify the rendered label at capture time.

  - id: sign-in-institutions
    page: guides/students/login-and-settings
    file: sign-in-institutions
    url: /{locale}/sign_in/
    hook: hooks/students-interact.mjs
    signOut: true
    crop:
      selector: '#main-container'
    must_show:
      - '"Sign in / Please select your institution..." heading'
      - UGent tile
      - Smartschool + Google Workspace + Office 365 tiles
      - institution search box
      - nothing dev-only (hide #active-announcement, the dev quick-login banner)

  # ---------------------------------------------------------------------------------------
  # Stage B -- novice (user 6), registration + menus. No state changes.
  # ---------------------------------------------------------------------------------------

  - id: homepage-browse-courses
    page: guides/students/courses
    file: homepage-browse-courses
    url: /{locale}/
    user: 6
    crop:
      union: ['a.link-card[href$="/courses/"]']
      pad: 24
    css: 'a.link-card[href$="/courses/"] { outline: 3px solid #d32f2f; outline-offset: 2px; }'
    must_show:
      - the exact link text the prose quotes ("Browse all courses on Dodona" / Dutch equivalent)

  - id: all-courses
    page: guides/students/courses
    file: all-courses
    url: /{locale}/courses/
    user: 6
    crop:
      clip: { x: 0, y: 0, width: 1440, height: 700 }
    must_show:
      - tabs (All courses / Featured / My courses)
      - search field
      - course rows with teacher / institution columns
      - EN UI in the EN shot (the retired file showed the NL UI here -- do not repeat that)

  - id: registration-open
    page: guides/students/courses
    file: registration-open
    url: /{locale}/courses/29/
    user: 6
    hook: hooks/students-interact.mjs
    tagClosest:
      - { name: registration-callout, text: 'Register', ancestor: 'div' }
    crop:
      selector: '[data-shot="registration-callout"]'
    must_show:
      - the "not a member of this course" sentence
      - Register button
      - no course description in frame (crop stays tight)

  - id: registration-moderated
    page: guides/students/courses
    file: registration-moderated
    url: /{locale}/courses/3/
    user: 6
    hook: hooks/students-interact.mjs
    tagClosest:
      - { name: registration-callout, text: 'Request registration', ancestor: 'div' }
    crop:
      selector: '[data-shot="registration-callout"]'
    must_show:
      - '"registration needs to be approved by a course administrator" sentence'
      - Request registration button
    notes: course 3's own NAME is seeded Dutch -- the tight callout crop keeps it out of frame.

  - id: registration-pending
    page: guides/students/courses
    file: registration-pending
    url: /{locale}/courses/3/
    user: 5 # already `pending` in seeds -- zero state change, do NOT use the novice here
    hook: hooks/students-interact.mjs
    tagClosest:
      - { name: registration-callout, text: 'pending', ancestor: 'div' }
    crop:
      selector: '[data-shot="registration-callout"]'
    must_show:
      - '"Your registration is pending" sentence'
      - Withdraw registration request button

  - id: registration-closed
    page: guides/students/courses
    file: registration-closed
    url: /{locale}/courses/6/?secret=CeJS2
    user: 6
    hook: hooks/students-interact.mjs
    tagClosest:
      - { name: registration-callout, text: 'not able to subscribe', ancestor: 'div' }
    crop:
      selector: '[data-shot="registration-callout"]'
    must_show:
      - '"You are currently not able to subscribe to this course" sentence, exactly, no buttons'

  - id: user-menu-my-profile
    page: guides/students/login-and-settings
    file: user-menu-my-profile
    url: /{locale}/
    user: 6
    keepNavbar: true
    hook: hooks/students-interact.mjs
    openUserMenu: true
    highlight:
      - text: 'My profile'
        scope: '.dodona-navbar'
    crop:
      clip: { x: 800, y: 0, width: 640, height: 420 }
    must_show:
      - open menu (My profile / My submissions / My questions / Theme / Sign out)
      - highlight on My profile
    notes: NAVBAR shot.

  # ---------------------------------------------------------------------------------------
  # Stage C -- novice profile shots. One state change (C3), undone at the end.
  # ---------------------------------------------------------------------------------------

  - id: profile-page
    page: guides/students/login-and-settings
    file: profile-page
    url: /{locale}/users/6/
    user: 6
    css: |
      /* hide the dev-only "This account was created manually..." token sign-in block --
         best-effort: no stable class given in the manifest, scope by nearest sensible
         container if this over-hides once verified live. */
      #main-container .card:has(a[href*="/token_sign_in/"]) { display: none !important; }
    hook: hooks/students-interact.mjs
    highlight:
      - selector: 'a[href$="/edit"]'
    crop:
      selector: '#main-container'
    must_show:
      - personal info + "Your timezone is set to Brussels." line
      - Edit button highlighted
      - no token sign-in URL visible

  - id: profile-timezone
    page: guides/students/login-and-settings
    file: profile-timezone
    url: /{locale}/users/6/edit/
    user: 6
    hook: hooks/students-interact.mjs
    highlight:
      - text: 'Time zone'
    crop:
      selector: '#main-container'
    must_show:
      - read-only name/email fields
      - highlighted Time zone row ((GMT+01:00) Brussels select)

  - id: timezone-warning
    page: guides/students/login-and-settings
    file: timezone-warning
    url: /{locale}/
    user: 6
    state: [students-novice-timezone-seoul]
    crop:
      union: ['.alert-warning']
      pad: 16
    must_show:
      - '"Your timezone is currently set to Seoul... change your timezone on your profile page." warning, with the profile-page link visible'

  # ---------------------------------------------------------------------------------------
  # Stage D -- student 5, course 29, EN pass. Stage E repeats this whole block on /nl/...
  # (see the file-level ordering comment). Every entry below implicitly assumes
  # students-series-deadlines is applied; D16 (contact form) is the one exception.
  # ---------------------------------------------------------------------------------------

  - id: recent-exercises
    page: guides/students/exercises
    file: recent-exercises
    url: /{locale}/
    state: [students-series-deadlines]
    crop:
      selector: 'div.card.user' # Home::RecentExercisesComponent, "Recent exercises" eyebrow
    must_show:
      - eyebrow "Recent exercises"
      - 5 rows with status icons + course subtitle
      - the warning triangle on the Curling row (best-is-not-last, already seeded)
      - chevron per row

  - id: course-page
    page: guides/students/courses
    file: course-page
    url: /{locale}/courses/29/
    state: [students-series-deadlines]
    crop:
      clip: { x: 0, y: 0, width: 1440, height: 900 }
    must_show:
      - course header (title, teacher, description, Unregister row)
      - at least one series card
      - green (not-expired) deadline under the series name
      - status column with correct/wrong icons

  - id: course-breadcrumb
    page: guides/students/courses
    file: course-breadcrumb
    url: /{locale}/courses/29/series/141/activities/369972474/
    state: [students-series-deadlines]
    keepNavbar: true
    hook: hooks/students-interact.mjs
    highlight:
      - text: 'Programming 1' # NL pass: "Programmeren 1" -- update alongside the Stage E course rename
        scope: '.dodona-navbar'
    crop:
      clip: { x: 0, y: 0, width: 1440, height: 64 }
    must_show:
      - '"Dodona | Programming 1 > Conditions > Curling" crumb, course name highlighted'
    notes: NAVBAR shot. Same URL as exercise-breadcrumb (D8) -- shoot both from one page load if driving the browser by hand.

  - id: deadline-warning
    page: guides/students/courses
    file: deadline-warning
    url: /{locale}/courses/29/
    state: [students-series-deadlines]
    hook: hooks/students-interact.mjs
    highlight:
      - rowText: 'Curling'
        selector: '.mdi-alert'
        scope: '#series_141' # best-effort Rails dom_id guess for the "Conditions" series card
    crop:
      selector: '#series_141'
    must_show:
      - series deadline visible
      - Curling row "Wrong" status + warning triangle
      - other rows for context

  - id: course-exercise-selection
    page: guides/students/exercises
    file: course-exercise-selection
    url: /{locale}/courses/29/
    state: [students-series-deadlines]
    css: '.activities-table { outline: 3px solid #d32f2f; outline-offset: 2px; }'
    crop:
      selector: '#series_140' # "Variables and types" series card; best-effort dom_id, see deadline-warning
    must_show:
      - numbered exercise rows with language icons
      - class progress bars
      - Status column

  - id: course-unregister
    page: guides/students/courses
    file: course-unregister
    url: /{locale}/courses/29/
    state: [students-series-deadlines]
    hook: hooks/students-interact.mjs
    tagClosest:
      - { name: unregister-row, text: 'Unregister' }
    crop:
      selector: '[data-shot="unregister-row"]'
    must_show:
      - course card context
      - highlighted Unregister link

  - id: exercise-page
    page: guides/students/exercises
    file: exercise-page
    url: /{locale}/courses/29/series/140/activities/347592237/
    state: [students-series-deadlines]
    hook: hooks/students-interact.mjs
    iframeProfilerFix: true
    crop:
      selector: '#main-container'
    must_show:
      - exercise title header
      - description
      - code editor
      - submit arrow
      - '"You can submit as many times as you like..." hint'
      - NO profiler badge in the description card's corner
    notes: description language follows the COURSE language -- Stage E's course29-dutch flip covers the NL pass, not the URL locale.

  - id: exercise-breadcrumb
    page: guides/students/exercises
    file: exercise-breadcrumb
    url: /{locale}/courses/29/series/141/activities/369972474/
    state: [students-series-deadlines]
    keepNavbar: true
    hook: hooks/students-interact.mjs
    highlight:
      - { text: 'Programming 1', scope: '.dodona-navbar' }
      - { text: 'Conditions', scope: '.dodona-navbar' }
      - { text: 'Curling', scope: '.dodona-navbar' }
    crop:
      clip: { x: 0, y: 0, width: 1440, height: 64 }
    must_show:
      - all three crumb levels (course, series, exercise), each boxed

  - id: handin-editor
    page: guides/students/exercises
    file: handin-editor
    url: /{locale}/courses/29/series/140/activities/347592237/
    state: [students-series-deadlines]
    hook: hooks/students-interact.mjs
    highlight:
      - selector: '.card-nav button[type="submit"], .card-nav .submit' # best-effort: icon-only submit button, no text to match
    crop:
      selector: '.card.card-nav'
    must_show:
      - empty editor line 1
      - Hand in / Submissions tabs
      - highlighted submit button
      - '"To sandbox" button'
      - hint line

  - id: feedback-tab
    page: guides/students/exercises
    file: feedback-tab
    url: /{locale}/courses/29/series/140/activities/347592237/
    state: [students-series-deadlines, students-submission-echo-correct]
    hook: hooks/students-interact.mjs
    clickTab: 'Feedback'
    crop:
      selector: '.card.card-nav'
    must_show:
      - three tabs, Feedback active
      - green verdict
      - at least 2 context cards
      - submission-history block
    notes: |
      Shared image -- also referenced from feedback/index.md as ../exercises/feedback-tab-en.png
      (one canonical file for both guides, per the shared-screenshot rule).

  - id: submissions-tab
    page: guides/students/exercises
    file: submissions-tab
    url: /{locale}/courses/29/series/141/activities/369972474/
    state: [students-series-deadlines]
    hook: hooks/students-interact.mjs
    clickTab: 'Submissions'
    highlight:
      - text: 'Submissions'
    crop:
      selector: '.card.card-nav'
    must_show:
      - reverse-chronological rows (Wrong above Correct)
      - status icons, time-ago, summary, chevrons

  - id: user-menu-my-submissions
    page: guides/students/exercises
    file: user-menu-my-submissions
    url: /{locale}/
    state: [students-series-deadlines]
    keepNavbar: true
    hook: hooks/students-interact.mjs
    openUserMenu: true
    highlight:
      - text: 'My submissions'
        scope: '.dodona-navbar'
    crop:
      clip: { x: 800, y: 0, width: 640, height: 420 }
    must_show:
      - open menu
      - highlight on My submissions
    notes: NAVBAR shot.

  - id: my-submissions
    page: guides/students/exercises
    file: my-submissions
    url: /{locale}/submissions/
    state: [students-series-deadlines]
    crop:
      clip: { x: 0, y: 0, width: 1440, height: 900 }
    must_show:
      - search field
      - Status filter
      - Exercise / Time / Status / Summary columns
      - varied status icons (correct/timeout/wrong/runtime/compilation/output-limit rows all exist in seeds)

  - id: my-submissions-open
    page: guides/students/exercises
    file: my-submissions-open
    url: /{locale}/submissions/
    state: [students-series-deadlines]
    css: 'tbody tr:first-child td.actions { outline: 3px solid #d32f2f; outline-offset: 2px; }'
    crop:
      clip: { x: 0, y: 0, width: 1440, height: 900 }
    must_show:
      - same table as my-submissions, with the first row's chevron boxed

  - id: submission-page
    page: guides/students/feedback
    file: submission-page
    url: /{locale}/submissions/1352/
    state: [students-series-deadlines]
    crop:
      clip: { x: 0, y: 0, width: 1440, height: 900 }
    must_show:
      - green Correct + "All tests succeeded"
      - '"Submission #1 for Curling in Programming 1" link line'
      - history list at right
      - Correctness tab active

  - id: feedback-diff
    page: guides/students/feedback
    file: feedback-diff
    url: /{locale}/submissions/ # placeholder; hook navigates to the real dynamic-id submission
    state: [students-series-deadlines, students-submission-echo-wrong]
    hook: hooks/students-interact.mjs
    dynamicSubmission: students-submission-echo-wrong
    crop:
      clip: { x: 0, y: 0, width: 1440, height: 950 }
    must_show:
      - red "Wrong - N tests failed"
      - Correctness tab with red badge count
      - Your output / Expected output diff with char-level highlighting

  - id: code-annotations
    page: guides/students/feedback
    file: code-annotations
    url: /{locale}/submissions/ # placeholder; hook navigates to the real dynamic-id submission
    state: [students-series-deadlines, students-submission-echo-lint]
    hook: hooks/students-interact.mjs
    dynamicSubmission: students-submission-echo-lint
    clickTab: 'Code'
    crop:
      clip: { x: 0, y: 0, width: 1440, height: 800 }
    must_show:
      - Code tab active with badge 2
      - one Warning + one Error machine annotation inline

  - id: visual-feedback
    page: guides/students/feedback
    file: visual-feedback
    url: /{locale}/submissions/1353/
    state: [students-series-deadlines]
    # FALLBACK: only if #1353 doesn't render the curling-target graphic live, switch to
    # `state: [students-series-deadlines, students-submission-curling-wrong]` and add
    # `hook: hooks/students-interact.mjs` + `dynamicSubmission: students-submission-curling-wrong`.
    crop:
      selector: '.group.card'
    must_show:
      - wrong test with diff
      - the drawn curling-target graphic below it

  - id: ask-question-button
    page: guides/students/exercises
    file: ask-question-button
    url: /{locale}/submissions/1347/
    state: [students-series-deadlines]
    hook: hooks/students-interact.mjs
    clickTab: 'Code'
    hoverLine: 6
    highlight:
      - text: 'Ask a question about your code'
    crop:
      clip: { x: 0, y: 0, width: 1440, height: 500 }
    must_show:
      - '"Ask a question about your code" button'
      - Annotations toggle group
      - pink per-line bubble on the hovered line

  - id: ask-question-frame1
    page: guides/students/exercises
    file: ask-question-frame1
    url: /{locale}/submissions/1347/
    state: [students-series-deadlines]
    hook: hooks/students-ask-question-flow.mjs
    frame: 1
    hoverLine: 16
    crop:
      clip: { x: 0, y: 0, width: 1440, height: 500 }
    must_show:
      - pink bubble visible on the hovered line (frame 1 of the ask-question gif)
    notes: |
      Frame-stitched gif, not a normal PNG output -- see hooks/students-ask-question-flow.mjs
      header. Stitch ask-question-frame{1,2,3}-{en,nl}.png into ask-question-{en,nl}.gif
      outside capture.mjs (ffmpeg), then delete the frame PNGs. Mark the gif as a stitched
      preview in the PR (capture-decisions.md "Students" #2), replaceable with a real recording.

  - id: ask-question-frame2
    page: guides/students/exercises
    file: ask-question-frame2
    url: /{locale}/submissions/1347/
    state: [students-series-deadlines]
    hook: hooks/students-ask-question-flow.mjs
    frame: 2
    hoverLine: 16
    questionText: 'Why do we need this line?' # NL pass: "Waarom hebben we deze regel nodig?"
    crop:
      clip: { x: 0, y: 0, width: 1440, height: 500 }
    must_show:
      - open question editor with the question text typed (frame 2)

  - id: ask-question-frame3
    page: guides/students/exercises
    file: ask-question-frame3
    url: /{locale}/submissions/1347/
    state: [students-series-deadlines, students-question-posted-en] # NL pass: students-question-posted-nl
    hook: hooks/students-ask-question-flow.mjs
    frame: 3
    hoverLine: 16
    crop:
      clip: { x: 0, y: 0, width: 1440, height: 500 }
    must_show:
      - posted question block (frame 3)

  - id: question-reply
    page: guides/students/exercises
    file: question-reply
    url: /{locale}/submissions/1347/
    state: [students-series-deadlines, students-teacher-annotation-en] # NL pass: students-teacher-annotation-nl
    hook: hooks/students-interact.mjs
    clickTab: 'Code'
    crop:
      clip: { x: 0, y: 0, width: 1440, height: 500 }
    must_show:
      - teacher comment attributed to the neutral name ("Your teacher" / "Je leraar")
      - '"Reply..." field'
      - EN text in the EN shot, NL text in the NL shot (the retired EN file showed Dutch text -- this fixes that)

  - id: contact
    page: guides/students/getting-started
    file: contact
    url: /{locale}/contact/
    # No course-29 state -- this page is unrelated to series 140/141.
    crop:
      selector: '#main-container'
    must_show:
      - Name / Email / Subject / Message fields
      - 'the "Send message" button (prose casing fix ships alongside: "send message" -> "Send message")'

  # ---------------------------------------------------------------------------------------
  # Stage F -- shared icon sets. Locale-independent (explicit `path:`, shot once).
  # Capture LAST: the course-status icons briefly move series 140's deadline into the past.
  # ---------------------------------------------------------------------------------------

  - id: icon-sub-queued-running
    path: images/submission-status-icons/queued-running.png
    url: /en/submissions/
    crop:
      selector: '#main-container table i.mdi-timer-sand-empty'

  - id: icon-sub-correct
    path: images/submission-status-icons/correct.png
    url: /en/submissions/
    crop:
      selector: '#main-container table i.mdi-check.colored-correct'

  - id: icon-sub-wrong
    path: images/submission-status-icons/wrong.png
    url: /en/submissions/
    crop:
      selector: '#main-container table i.mdi-close.colored-wrong'

  - id: icon-sub-time-limit-exceeded
    path: images/submission-status-icons/time-limit-exceeded.png
    url: /en/submissions/
    crop:
      selector: '#main-container table i.mdi-alarm.colored-wrong'

  - id: icon-sub-memory-limit-exceeded
    path: images/submission-status-icons/memory-limit-exceeded.png
    url: /en/submissions/
    crop:
      selector: '#main-container table i.mdi-memory.colored-wrong'

  - id: icon-sub-compilation-error
    path: images/submission-status-icons/compilation-error.png
    url: /en/submissions/
    crop:
      selector: '#main-container table i.mdi-lightning-bolt-circle.colored-wrong'

  - id: icon-sub-runtime-error
    path: images/submission-status-icons/runtime-error.png
    url: /en/submissions/
    crop:
      selector: '#main-container table i.mdi-flash.colored-wrong'

  - id: icon-sub-internal-error
