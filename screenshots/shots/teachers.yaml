  - id: CM-2
    page: guides/teachers/course-management
    file: course-after-edit
    url: /{locale}/courses/11/
    state: [course11-naming]
    crop:
      selector: '#main-container .card'
    must_show:
      - header card: title, teacher, Teaching/Moderated pills, stats row

  - id: CM-3
    page: guides/teachers/course-management
    file: course-submissions-link
    url: /{locale}/courses/11/
    keepNavbar: true
    state: [course11-naming]
    hook: hooks/course-management.mjs
    crop:
      selector: '[data-shot="cm3-strip"]'
    must_show:
      - "\"Submitted solutions\" stat"
      - submissions icon in the navbar

  - id: CM-4
    page: guides/teachers/course-management
    file: course-submissions-filter
    url: /{locale}/courses/11/submissions/
    state: [course11-naming]
    hook: hooks/cap-height.mjs
    cap_height: 750
    crop:
