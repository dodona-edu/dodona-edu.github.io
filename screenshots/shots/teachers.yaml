# Teacher-guide shot manifest (Phase 4 re-shoot, 2026-07-31).
#
# All 36 shots below were actually captured (course 11 "Visualisation Test",
# zeus/user 1). CM-7 (dolos) was skipped: clicking "Detect plagiarism" needs a
# real export job plus a live call to the external Dolos service, and this
# dev instance has no background job worker, so the click hangs forever. It
# stays a manual capture; see its `manual: true` entry at the end of
# course-management.
#
# State scenarios used below (bin/rails runner in the dodona checkout):
#   course11-naming[.rb nl]      course 11 + series 51-54 renamed off their
#                                 seeded lorem names; pass "nl" for the NL pass
#   course11-labels               seeds the 5a/5b member labels (course 11 has
#                                 none by default)
#   eval1-score-items[.rb nl]    renames evaluation 1's score items off their
#                                 seeded lorem names; pass "nl" for the NL pass
#   series-visibility              (SS-1 only) three series get non-default
#                                 visibilities at once
#   grading-wizard-series52       keeps series 52 evaluation-free so the
#                                 G-1..G-6 wizard shots start clean
#
# course11-naming and eval1-score-items are locale-parameterized (one scenario,
# run once per pass) because a single shot id is captured for both locales but
# the `state:` list itself isn't locale-aware — run the matching setup.rb
# (bare, or with an "nl" argument) before each `--locale` pass.

area: teachers
defaults:
  user: 1

shots:
  # ---------------- user-management ----------------
  - id: UM-1
    page: guides/teachers/user-management
    file: course-nav-users
    url: /{locale}/courses/11/
    keepNavbar: true
    state: [course11-naming]
    crop:
      union: ['.dodona-navbar', '#main-container .card:first-of-type']
      pad: 8
    must_show:
      - course navbar icons incl. the users icon
      - "\"25 Registered users\" stat"
      - "course title \"Programming\""

  - id: UM-2
    page: guides/teachers/user-management
    file: users-overview
    url: /{locale}/courses/11/members/
    state: [course11-naming, course11-labels]
    crop:
      selector: '#main-container .card'
    must_show:
      - Registered / Pending 3 / Unregistered tabs
      - Member labels + Institution filter dropdowns
      - Download user list + Edit all labels buttons
      - institution column values, progress bars, 5a/5b labels
      - graduation-cap icons in the left margin for staff rows

  - id: UM-3
    page: guides/teachers/user-management
    file: users-filtered
    url: /{locale}/courses/11/members/
    state: [course11-naming, course11-labels]
    hook: hooks/user-management.mjs
    crop:
      selector: '#main-container .card'
    must_show:
      - two active filter chips (label 5a + Universiteit Gent)
      - filtered rows showing the 5a label
      - both filter dropdowns

  - id: UM-4
    page: guides/teachers/user-management
    file: user-progress-tooltip
    url: /{locale}/courses/11/members/
    state: [course11-naming]
    hook: hooks/user-management.mjs
    crop:
      selector: '[data-shot="um4-tooltip"]'
    must_show:
      - progress tooltip text
      - tricolor progress bar

  - id: UM-5
    page: guides/teachers/user-management
    file: users-edit-permissions
    url: /{locale}/courses/11/members/
    state: [course11-naming]
    hook: hooks/user-management.mjs
    crop:
      union: ['[data-shot="um5-admin"]', '[data-shot="um5-student"]']
      pad: 0
    must_show:
      - admin row (demote icon) and student row (promote icon) side by side

  - id: UM-6
    page: guides/teachers/user-management
    file: users-admin-icon
    url: /{locale}/courses/11/members/
    state: [course11-naming]
    hook: hooks/user-management.mjs
    crop:
      selector: '[data-shot="um6-strip"]'
    must_show:
      - left-margin cap icons on staff rows vs. a row without one

  - id: UM-7
    page: guides/teachers/user-management
    file: member-overview
    url: /{locale}/courses/11/members/5
    viewport: { width: 1600, height: 1700 }
    state: [course11-naming]
    hook: hooks/user-management.mjs
    crop:
      selector: '#main-container'
    must_show:
      - submissions/correct/unfinished stats trio
      - rendered punchcard + heatmap (not "Loading...")
      - Edit labels button
      - series status sidebar

  # ---------------- course-management ----------------
  - id: CM-1
    page: guides/teachers/course-management
    file: course-edit-button
    url: /{locale}/courses/11/
    keepNavbar: true
    state: [course11-naming]
    hook: hooks/course-management.mjs
    crop:
      selector: '[data-shot="cm1-strip"]'
    must_show:
      - pencil (edit) icon in the course navbar
