      - Status filter dropdown
      - Retest submissions button

  - id: CM-5
    page: guides/teachers/course-management
    file: course-submissions-filtered
    url: /{locale}/courses/11/submissions/
    state: [course11-naming]
    hook: hooks/course-management.mjs
    crop:
      selector: '#main-container .card'
    must_show:
      - active filter chips for user + exercise
      - rows all matching that user/exercise pair

  - id: CM-6
    page: guides/teachers/course-management
    file: submissions-detect-plagiarism
    url: /{locale}/courses/11/series/54/activities/1638674449/submissions/
    state: [course11-naming]
    hook: hooks/cap-height.mjs
    cap_height: 235
    crop:
      selector: '#main-container .card'
    must_show:
      - Retest submissions button
      - Detect plagiarism button

  - id: CM-7
    page: guides/teachers/course-management
    file: staff.dolos
    path: en/guides/teachers/course-management/staff.dolos.png
    manual: true
    # Not captured by this pipeline: "Detect plagiarism" triggers a real
    # export job plus a live call to dolos.ugent.be before opening a new
    # tab. This dev instance has no background job worker, so the export
    # never finishes and the click hangs. Needs a manual capture on an
    # instance with a running worker (see CM-6 for how to reach the button).
    must_show:
      - Dolos branding + similarity view
      - no Dodona dev URLs visible

  # ---------------- exercise-series-management ----------------
  - id: ESM-1
    page: guides/teachers/exercise-series-management
    file: series-form
    url: /{locale}/courses/11/series/new
    viewport: { width: 1600, height: 1750 }
    state: [course11-naming]
    hook: hooks/exercise-series-management.mjs
    crop:
      selector: '[data-shot="esm1-form"]'
    must_show:
      - kind picker (Regular series / Assessment series / Optional series)
      - "\"The kind can still be changed after the series has been created.\""
      - Name, Deadline, description editor, visibility radios

  - id: ESM-2
    page: guides/teachers/exercise-series-management
    file: series-actions-menu
    url: /{locale}/courses/11/
    state: [course11-naming, grading-wizard-series52]
    hook: hooks/open-menu.mjs
    menu_toggle: '#series-card-52 button.series-dropdown'
    crop:
      union: ['#series-card-52 .card-actions', '#series-card-52 .dropdown-menu']
      pad: 8
    must_show:
      - Series scoresheet + Evaluate series buttons
