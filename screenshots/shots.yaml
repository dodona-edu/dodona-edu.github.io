    url: http://dodona.localhost:3000/{locale}/courses/29/
    user: 1 # zeus
    state: [faq-cast, faq-annotated-submission, faq-annotations-content]
    hook: hooks/faq-add-comment.mjs
    crop:
      union: ['.feedback-table-options', '.code-listing-container']
    must_show:
      - '"Add global comment" button'
      - selected lines 2-4
      - pink "Add comment" bubble
      - Annotations toggle
    # Pair: NL "Globale opmerking toevoegen", "Voeg opmerking toe".

  - id: save-existing-comment
    page: faq/annotations
    file: save-existing-comment
    url: http://dodona.localhost:3000/{locale}/courses/29/
    user: 1 # zeus
    state: [faq-cast, faq-annotated-submission, faq-annotations-content]
    hook: hooks/faq-save-existing-comment.mjs
    crop:
      selector: .code-listing-container
    must_show:
      - 'comment attribution "Your teacher"'
      - open kebab menu with "Save comment"
    # Pair: NL menu "Opmerking opslaan", author "Je leraar".

  - id: reuse-saved-comment
    page: faq/annotations
    file: reuse-saved-comment
    url: http://dodona.localhost:3000/{locale}/courses/29/
    user: 1 # zeus
    state: [faq-cast, faq-annotated-submission, faq-annotations-content]
    hook: hooks/faq-reuse-saved-comment.mjs
    crop:
      selector: .code-listing-container
    must_show:
      - both saved-comment titles ("Python 2 print", "Loop required") with preview text
    # Pair: NL "Loop gebruiken" etc.

  - id: saved-comments-search
    page: faq/annotations
    file: saved-comments-search
    url: http://dodona.localhost:3000/{locale}/courses/29/
    user: 1 # zeus
    state: [faq-cast, faq-annotated-submission, faq-annotations-content]
    hook: hooks/faq-saved-comments-search.mjs
    crop:
