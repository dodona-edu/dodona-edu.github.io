# Shot entries for guides/teachers/statistics.
#
# - Course 11 ("Visualisation Test", renamed to "Programming"/"Programmeren"
#   by the course11-naming scenario) is the target: it is seeded with
#   submissions precisely for the visualisations.
# - ST-1/ST-2 (punchcard + heatmap) live on the course statistics page. The
#   data is computed by a background job (UpdatePunchcardMatrixJob /
#   UpdateHeatmapMatrixJob) that the controller enqueues on first request and
#   the frontend polls every second until it is ready. A Solid Queue worker
#   is running on the capture instance, so hooks/course-statistics.mjs polls
#   the container for an <svg> instead of trusting the fixed post-goto wait.
# - ST-3..ST-6 are tabs inside a series card on the course page:
#   hooks/course-statistics.mjs clicks the matching `.graph-toggle` button
#   (data-type: violin | stacked | timeseries | ctimeseries) for series 52
#   and waits for `#stats-container-52 svg`. Series 52 ("Conditions") was
#   picked over series 51 (which has more submissions) because series 51's
#   tab pane does not activate on click in the current app build (verified:
#   the pane keeps class "tab-pane" instead of "tab-pane active show") --
#   flag for an app-side follow-up, not a hook bug.
# - Series graphs only count student submissions on non-optional series;
#   none of course 11's series 51-54 are optional.
# - Graph text (axis labels, tooltips, legend) is localised, so every shot
#   needs -en and -nl variants.

shots:
  # ---------------- statistics (course statistics page) ----------------
  - id: ST-1
    page: guides/teachers/statistics
    file: course-statistics-punchcard
    url: /{locale}/courses/11/statistics/
    state: [course11-naming]
    hook: hooks/course-statistics.mjs
    crop:
      union: ['h3:has-text("Punchcard")', '#punchcard-container']
      pad: 8
    must_show:
      - "\"Punchcard\" section header with the clock icon"
      - weekday rows Monday-Sunday, hour columns 00:00-23:00
      - dots of clearly different sizes

  - id: ST-2
    page: guides/teachers/statistics
    file: course-statistics-heatmap
    url: /{locale}/courses/11/statistics/
    state: [course11-naming]
    hook: hooks/course-statistics.mjs
    crop:
      union: ['h3:has-text("Heatmap")', '#heatmap-container']
      pad: 8
    must_show:
      - "\"Heatmap\" section header with the calendar icon"
      - one calendar block per academic year with month labels
      - day cells in visibly different shades

  # ---------------- statistics (series graphs on the course page) --------
  - id: ST-3
    page: guides/teachers/statistics
    file: series-graph-violin
    url: /{locale}/courses/11/
    state: [course11-naming]
    hook: hooks/course-statistics.mjs
    crop:
      union: ['#series-card-52']
      pad: 8
    must_show:
      - graph title "Number of submissions per user" + info icon
      - the four graph-toggle buttons in the series header, violin active
      - one violin shape per exercise with the average dot
      - x-axis label "Number of submissions"

  - id: ST-4
    page: guides/teachers/statistics
    file: series-graph-stacked-status
    url: /{locale}/courses/11/
    state: [course11-naming]
    hook: hooks/course-statistics.mjs
    crop:
      union: ['#series-card-52']
      pad: 8
    must_show:
      - graph title "Distribution of submission statuses"
      - one bar per exercise, segmented by status colours
      - status legend (Correct, Wrong, ...)

  - id: ST-5
    page: guides/teachers/statistics
    file: series-graph-timeseries
    url: /{locale}/courses/11/
    state: [course11-naming]
    hook: hooks/course-statistics.mjs
    crop:
      union: ['#series-card-52']
      pad: 8
    must_show:
      - graph title "Submissions over time"
      - Start date / End date pickers above the graph
      - one row of squares per exercise, shading varies
      - bin-size legend under the graph (e.g. "1 day")

  - id: ST-6
    page: guides/teachers/statistics
    file: series-graph-cumulative-timeseries
    url: /{locale}/courses/11/
    state: [course11-naming]
    hook: hooks/course-statistics.mjs
    crop:
      union: ['#series-card-52']
      pad: 8
    must_show:
      - graph title "Users with at least one correct submission"
      - one line per exercise climbing over time
      - y-axis with percentage ticks

  # ---------------- optional extras (referenced in prose, not required) ---
  - id: ST-7
    page: guides/teachers/statistics
    file: class-progress-bar
    url: /{locale}/courses/11/
    state: [course11-naming]
    crop:
      selector: '.series-activities-table-wrapper'
    must_show:
      - "\"Class progress\" column header"
      - grey started-fraction and coloured correct-fraction in the bars

---
# Shots for the student sandbox page (guides/students/scratchpad). The page
# ships without images -- add the matching ![...] references to en/nl
# index.md in the same pass that captures these.
#
# Target: activity 576967365 ("ISBN", series 141/Conditions, course 29) --
# a published Python exercise, so scratch_pad_supported? is true. Reached via
# the bare /activities/<id>/ URL (no course/series in the path), which
# matters: ActivitiesController#show only sets @course from a course_id
# param, so ActivityPresenter's language (course.language || ...) falls back
# straight to the URL locale here -- unlike the courses/29/series/... shots
# elsewhere in this file, these do NOT need the students-course29-dutch
# language flip for the NL pass (verified against the controller and live).
# course29-repo-access is likewise not needed: that grant unblocks students,
# but the signed-in user for this section is zeus (defaults.user: 1), who
# has access regardless (verified live, 200 without the grant).
#
# SB-4 needs a judged Python submission whose feedback has a context with
# stdin or statements -- FeedbackContext#_renderTutorLink only renders the
# Debug button when submissionContext.scratchPadSupported AND
# (context.data.statements || context.data.stdin). Submission 1350 (student
# 5, "ISBN", course 29, status correct) already has a context with
# statements set, so no throwaway submission is needed.
#
# Capture notes (from the dev-and-media cookbook, refined against the live
# instance):
# - The sandbox opens as an off-canvas `#scratchpad-offcanvas`: code editor +
#   Run/output on the left, the exercise description in an <iframe> on the
#   right.
# - The Run/Debug buttons (md-filled-button/md-outlined-button) sit a few
#   shadow roots deep (p-code-runner > p-button-lint). Playwright's own
#   locators pierce open shadow roots natively, so a scoped text locator
#   reaches them directly -- no manual shadow-root walk needed here (that's
#   only for document.querySelector-based code, e.g. style injection).
# - The Run button is clickable (and queues a run) before Pyodide has
#   actually finished loading. The reliable signal is the `backend-ready`
#   attribute p-code-runner reflects once papyros.runner.backendReady
#   resolves (requires @dodona/papyros >= 4.8.0); wait on that, not on the
#   button appearing. See hooks/sandbox.mjs.

defaults:
  user: 1

shots:
  # ---------------- students/scratchpad ----------------
  - id: SB-1
    page: guides/students/scratchpad
    file: to-sandbox-button
    url: /{locale}/activities/576967365/
    crop:
      selector: '.card-actions.card-actions-sticky'
      pad: 8
    must_show:
      - the outlined "To sandbox" / "Naar sandbox" button with clipboard icon
      - the filled submit button next to it

  - id: SB-2
    page: guides/students/scratchpad
    file: sandbox-run
    url: /{locale}/activities/576967365/
    hook: hooks/sandbox.mjs
    # Hook opens the offcanvas, waits for backend-ready, types a short
    # program that prints something and reads input(), clicks Run, answers
    # the input prompt, and waits for the real produced output (not just the
    # run finishing) before the shot is taken.
    crop:
      selector: '#scratchpad-offcanvas'
    must_show:
      - '"Python sandbox" header'
      - code editor with the short program, Run/Debug buttons, "Finalize and submit" / "Naar indienbox"
      - input field and output panel with the produced output
      - Description tab with the exercise description on the right

  - id: SB-3
    page: guides/students/scratchpad
    file: sandbox-debugger
    url: /{locale}/activities/576967365/
    hook: hooks/sandbox.mjs
    # Hook types a short flat (unindented) program, clicks Debug, waits for
    # the frame picker to attach, then jumps to the last step so real
    # frames/variables are showing instead of the frame-0 placeholder card.
    crop:
      selector: '#scratchpad-offcanvas'
    must_show:
      - Debugger tab active on the right with the step slider and arrow buttons
      - variables/frames shown for the current step
      - highlighted current line in the editor on the left
      - '"Stop debugging" / "Stop debugger" button'

  - id: SB-4
    page: guides/students/scratchpad
    file: feedback-debug-button
    url: /{locale}/submissions/1350/
    wait: 3000 # client-side feedback table fetches + renders after load
    crop:
      selector: '.group:has(.tutorlink)' # the test-case card containing the Debug button
      pad: 8
    must_show:
      - a test-case card from the feedback page
      - the "Debug" / "Debuggen" button with the bug-play icon

---
# Shots for the sections + course sidebar pages (Phase 5).
#
# All four shots show localised UI, so each is captured per locale
# (…-en.png / …-nl.png), same as the existing manifest entries.
#
# State scenario (bin/rails runner in the dodona checkout):
#   course11-sections.setup.rb [nl] [empty] / .teardown.rb -- course 11 gets
#   two sections ("Basics" / "Basisbegrippen" and "Loops" / "Lussen"); series
#   51+52 go into the first section, series 53+54 into the second (section_id
#   and order set via the same semantics as CoursesController#reorder_series).
#   Builds on course11-naming so series names are presentable. Pass "empty"
#   to additionally create the empty "Advanced" / "Gevorderd" third section
#   SEC-4 needs; leave it off for SEC-1..3 so their shots stay uncluttered.
#
# SEC-2 wants visible per-series progress bars: zeus (user 1) is a course
# admin in course 11 but has zero submissions there, so its progress bars
# would be all-grey/unstarted. User 126 is a real member with a mixed spread
# of accepted/started/regressed statuses across all four series -- SEC-1 and
# SEC-2 capture as that user instead of the user: 1 default.

shots:
  # ---------------- students/courses ----------------
  - id: SEC-1
    page: guides/students/courses
    file: course-sections
    url: /{locale}/courses/11/
    state: [course11-naming, course11-sections]
    user: 126
    crop:
      union: ['.series-section:nth-of-type(1)', '.series-section:nth-of-type(2)']
      pad: 8
    must_show:
      - two section headers with their names
      - "series/activity counts in a header (e.g. \"2 series · 10 activities\")"
      - Collapse button next to a section header
      - at least one series card under a section header

  - id: SEC-2
    page: guides/students/courses
    file: course-sidebar
    url: /{locale}/courses/11/
    state: [course11-naming, course11-sections]
    user: 126
    # The nav element itself is stretched to full page height; bound the crop to
    # its actual content instead.
    crop:
      union: ['#scrollspy-nav > *:first-child', '#scrollspy-nav > *:last-child']
      pad: 16
    must_show:
      - section names as group headers in the sidebar
      - series entries nested under their section
      - a per-series progress bar with coloured segments
      - the active (highlighted) series link

  # ---------------- teachers/exercise-series-management ----------------
  - id: SEC-3
    page: guides/teachers/exercise-series-management
    file: manage-series-sections
    url: /{locale}/courses/11/manage_series/
    state: [course11-naming, course11-sections]
    crop:
      selector: '#main-container .card'
    must_show:
      - reorder hint above the table (Drag the handles to reorder…)
      - a section row with its name input and "series · activities" meta
      - Add series and Delete section buttons on the section row
      - series rows with drag handles under the section row
      - Add section button below the table

  # Admin-only empty-section state on the course page. The prose alone
  # covers it, but the dashed empty-state box is a distinct enough visual
  # that it earns a shot; included in the page after that sentence.
  - id: SEC-4
    page: guides/teachers/exercise-series-management
    file: section-empty
    url: /{locale}/courses/11/
    state: [course11-naming, course11-sections] # run course11-sections.setup.rb with the "empty" arg
    crop:
      selector: '.series-section.is-empty'
      pad: 8
    must_show:
      - empty section header with its name
      - "\"This section has no series yet.\" message"
      - New series button

---
# Small-topics shots (feat/docs-small-topics pages). States:
# - SM-favorites needs Sofie (user 5) to have a favourite course
#   (CourseMembership#favorite on course 29); see state/sm-favorites.{setup,teardown}.rb.
# - SM-notification-bell / SM-notifications-page need no state: Sofie already has
#   unread seeded notifications (ids 18-20, 22).
# - SM-announcement needs no state: Announcement#3 (user_group: students, active,
#   no stop date) is already unread by Sofie and is the one
#   Announcements::BannerComponent picks for her.
# - SM-archived-banner needs no state either: course 24 ("Empty state - student,
#   archived") is seeded with archived_override: true and visibility:
#   visible_for_all, so Sofie can see it (and its "This course is archived" banner)
#   without being a member -- nothing to restore.
# NL pass note: these shots don't flip course 29's language (unlike the
# faq-course-language scenario), so SM-favorites and SM-calendar-menu show its
# English name ("Programming 1") even under /nl/. That matches production for an
# English-named course and is expected, not a bug.
defaults:
  user: 5
shots:
  - id: SM-favorites
    page: guides/students/courses
    file: favorite-courses
    url: /{locale}/
    state: [sm-favorites]
    crop: { selector: '.favorites-row' }
    must_show: [Favorites row eyebrow, heart on a course card]
  - id: SM-calendar-menu
    page: guides/students/courses
    file: course-calendar-menu
    url: /{locale}/courses/29/
    hook: hooks/open-menu.mjs
    menu_toggle: '#main-container .card:first-of-type button.dropdown-toggle'
    crop:
      union: ['#main-container .card:first-of-type .card-actions', '#main-container .card:first-of-type .dropdown-menu']
      pad: 8
    must_show: [open kebab menu, Add course to calendar item]
  - id: SM-archived-banner
    page: guides/students/courses
    file: course-archived-banner
    url: /{locale}/courses/24/
    crop: { selector: '.page-messages [role="status"]' }
    must_show: [This course is archived banner]
  - id: SM-notification-bell
    page: faq/notifications
    file: notification-bell
    url: /{locale}/
    hook: hooks/open-menu.mjs
    menu_toggle: '#navbar-notifications-toggle'
    keepNavbar: true
    crop:
      union: ['#navbar-notifications-toggle', '.notification-dropdown']
      pad: 8
    must_show: [bell with unread dot, dropdown with a notification, View all link]
  - id: SM-notifications-page
    page: faq/notifications
    file: notifications-page
    url: /{locale}/notifications/
    crop: { selector: '#main-container .card:first-of-type' }
    must_show: [notification rows with read toggle and delete, Clear notifications]
  - id: SM-announcement
    page: faq/notifications
    file: announcement-banner
    url: /{locale}/
    hook: hooks/sm-announcement.mjs
    crop: { selector: '#active-announcement' }
    must_show: [announcement text, dismiss cross]

  # ---------------- microsoft-entra (guides/general) ----------------
  # Both shots below are Microsoft's own consent screens at
  # login.microsoftonline.com, not Dodona pages, so the runner has no page to
  # navigate to and can't capture them. They stay manual captures.
  #
  # To recapture: open the consent URL in the comment while signed in as a
  # tenant admin, clip the `#lightbox` element at 2x, and white out the
  # account email that sits above the heading. Do not click Accept.
  #
  # The Dutch pass needs an `Accept-Language: nl-BE` request header on that
  # request; the `ui_locales` and `mkt` URL parameters are both ignored by
  # this Microsoft flow.
  - id: ME-1
    page: guides/general/microsoft-entra
    file: admin-consent
    manual: true
    # https://login.microsoftonline.com/{tenant}/adminconsent?client_id={client_id}
    must_show:
      - Dodona name, publisher and blue verified badge
      - permission list showing only "View users' basic profile"
      - no account email visible

  - id: ME-2
    page: guides/general/microsoft-entra
    file: user-consent
    manual: true
    # https://login.microsoftonline.com/common/oauth2/v2.0/authorize?client_id={client_id}&response_type=code&redirect_uri=https%3A%2F%2Fdodona.be%2Fusers%2Fauth%2Fmicrosoft%2Fcallback&response_mode=query&scope=openid%20email%20profile&prompt=consent
    must_show:
      - Dodona name, publisher and blue verified badge
      - permission list showing "View your basic profile" and "Maintain access to data you have given it access to"
      - no account email visible
