---
# FAQ area shot manifest. See ../README.md for the schema.
#
# Shots 1-17 (faq/annotations) build one continuous story on a single judged ISBN
# submission (the course29-repo-access scenario must be applied first: the seeds
# grant course 29 no repositories, so activity pages 403 for students without it):
# student asks a question -> teacher replies and saves a comment -> more
# comments get posted, saved and reused -> list/overview pages -> back to the student
# for the notification and reply views. They share state scenarios faq-cast,
# faq-annotated-submission and faq-annotations-content (see screenshots/state/).
#
# Two more state scenarios exist (faq-course-language, faq-course9-rename) but are
# deliberately NOT referenced by any shot's `state:` list below: both are NL-pass-only,
# and capture.mjs prints a shot's required scenarios regardless of which --locale you
# run, so listing them here would make the runner demand a Dutch course flip even for
# the EN pass. Apply them by hand between passes -- see their own file headers.
#
# Shots 1-17's `url` points at the course page, not the submission directly: the real
# submission id only exists after faq-annotated-submission.setup.rb runs (it's a fresh
# row each pass), so capture.mjs's own goto() hits this harmless placeholder and each
# shot's hook immediately navigates to the real submission URL itself (see
# hooks/faq-lib.mjs#gotoAnnotatedSubmission). None of shots 1-17's hooks have been run
# against a live dev server -- see the task report for what's verified vs. best-effort.
#
# Shots 18-21 (faq/api-tokens, faq/featured-courses) are already captured and placed
# at the paths below by a proven scratch script; their hooks here reproduce that same
# script for a future re-run, they weren't used to produce the files currently in the
# repo.

defaults:
  viewport: { width: 1440, height: 1400 }
  wait: 1800

shots:
  # ---------------------------------------------------------------------------------
  # faq/annotations (shots 1-17)
  # ---------------------------------------------------------------------------------

  - id: ask-question-button
    page: faq/annotations
    file: ask-question-button
    url: http://dodona.localhost:3000/{locale}/courses/29/
    user: 5 # Sofie
    state: [faq-annotated-submission, faq-annotations-content]
    hook: hooks/faq-ask-question-button.mjs
    crop:
      union: ['.feedback-table-options', '.code-listing-container']
    must_show:
      - '"Ask a question about your code" button'
      - Annotations 3-state toggle group
      - pink gutter "Ask question" bubble on a hovered line
      - several code lines
    # Pair: NL button text "Stel een vraag over je code" / bubble "Stel een vraag".

  - id: ask-question
    page: faq/annotations
    file: ask-question
    manual: false
    url: http://dodona.localhost:3000/{locale}/courses/29/
    user: 5 # Sofie
    state: [faq-annotated-submission, faq-annotations-content]
    hook: hooks/faq-ask-question-gif.mjs
    crop:
      union: ['.feedback-table-options', '.code-listing-container']
    must_show:
      - form with "Ask question" submit button
      - '"Markdown is supported" hint'
      - the posted question thread
    # NOT a single crop: this is a .gif in both the old tree and the manifest's
    # renamed target (ask-question-en.gif / -nl.gif). capture.mjs can only ever write
    # `<file>-<locale>.png` (outputPath() hardcodes the extension), so it cannot
    # produce the .gif itself. The hook (hooks/faq-ask-question-gif.mjs) drives the
    # real ask-a-question flow (needed anyway -- it creates Question 1 for the rest of
    # the chain) and dumps a screenshot per step into screenshots/.frames/ask-question-
    # <locale>/ as a side effect; the crop above is just a static fallback/preview of
    # the end state, written to the normal `-en.png`/`-nl.png` path, NOT the shipped
    # file. Stitch the real gif by hand:
    post: |
      ffmpeg -y \
        -loop 1 -t 2.5 -i screenshots/.frames/ask-question-en/0-bubble.png \
        -loop 1 -t 2.5 -i screenshots/.frames/ask-question-en/1-form.png \
        -loop 1 -t 2.5 -i screenshots/.frames/ask-question-en/2-typed.png \
        -loop 1 -t 3   -i screenshots/.frames/ask-question-en/3-posted.png \
        -filter_complex "[0][1]xfade=transition=fade:duration=0.5:offset=2.0[a];[a][2]xfade=transition=fade:duration=0.5:offset=4.0[b];[b][3]xfade=transition=fade:duration=0.5:offset=6.0,format=yuv420p[v]" \
        -map "[v]" -r 25 en/faq/annotations/ask-question-en.gif
      # repeat with .frames/ask-question-nl/ -> nl/faq/annotations/ask-question-nl.gif
    # Per the coordinator decision: this stitched preview is acceptable, but the PR
    # description must say so and note Bart can replace it with a real QuickTime
    # screencast.

  - id: question-on-code
    page: faq/annotations
    file: question-on-code
    url: http://dodona.localhost:3000/{locale}/courses/29/
    user: 1 # zeus, displayed as "Your teacher"
    state: [faq-cast, faq-annotated-submission, faq-annotations-content]
    hook: hooks/faq-question-on-code.mjs
    crop:
      selector: .code-listing-container
    must_show:
      - question attributed to Sofie Tu Dent with a question badge
      - '"Reply..." placeholder'
      - '"Mark as answered" link'
      - the machine Error annotation, if the judge renders one for the Python 2 print (open question 6 -- keep it in the crop if present, otherwise the shot still satisfies the prose without it)
    # Pair: NL "Reageer...", "of Als beantwoord markeren".

  - id: save-comment-while-writing
    page: faq/annotations
    file: save-comment-while-writing
    url: http://dodona.localhost:3000/{locale}/courses/29/
    user: 1 # zeus
    state: [faq-cast, faq-annotated-submission, faq-annotations-content]
    hook: hooks/faq-save-comment-while-writing.mjs
    crop:
