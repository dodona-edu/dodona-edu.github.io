---
# Student-guide screenshot manifest. Converted from the Phase 4 research doc
# (manifest-students.md) into the checked-in capture-system format described in
# ../README.md. Nothing here has been captured yet -- this file drives the upcoming capture
# chunks (`node screenshots/capture.mjs --area students ...`).
#
# Stages D/E (course 29 exercise/submission shots) additionally need the
# course29-repo-access scenario applied (see ../state/), or activity pages 403.
#
# Hand-in flow: confirmed LEGACY (capture-decisions.md "Students" #1) -- production students
# still see the tabbed `Hand in / Submissions / Feedback` card, so every exercise/feedback
# shot below targets `.card.card-nav` and its tabs, not the new-flow selectors.
#
# Selector confidence: selectors quoted verbatim from the manifest (e.g. `.activity-table`,
# `.card.card-nav`, `#main-container`, `.alert-warning`, `td.actions`, `.group.card`,
# `a.link-card[href*="/courses/?tab=all"]`) are high confidence. Selectors built from the manifest's
# prose descriptions only ("the globe", "the user chip", "the callout") go through
# hooks/students-interact.mjs's text-matching helpers (`highlight`, `tagClosest`) and are
# best-effort -- verify against the live dev instance before trusting a capture run.
#
# ORDERING (see also each state/students-*.setup.rb):
#   1. Stage A/B/C (signed-out, novice, profile) -- no course-29 state, any order.
#   2. students-series-deadlines.setup.rb, then Stage D (EN pass) D1-D6 (homepage/course
#      shots) BEFORE D9-D15 (which create throwaway submissions/annotations/questions that
#      would otherwise pollute "Recent exercises", progress bars and counts).
#   3. students-course29-dutch.setup.rb -- ONLY after the full EN pass above -- then Stage E
#      repeats D1-D16 on /nl/... with the -nl state variants (students-teacher-annotation-nl,
#      students-question-posted-nl).
#   4. students-course29-dutch.teardown.rb and students-series-deadlines.teardown.rb, in that
#      order, once Stage E is fully captured.
#   5. Stage F (icon crops) last, on the now-clean seeded state, using its own self-contained
#      students-icons-past-deadline scenario for the 2 deadline-dependent icons.
#
# Throwaway submissions/annotations/questions (D10, D14b, D14c, D14d-fallback, D15) are each
# destroyed right after their shot in a given locale pass, and independently recreated for
# the other locale pass (their own scenario's setup/teardown pair is reused for both passes,
# except D15's teacher-annotation and question-posted scenarios which have distinct -en/-nl
# variants since their text differs by locale).

defaults:
  user: 5
  viewport: { width: 1440, height: 1000 }

shots:
  # ---------------------------------------------------------------------------------------
  # Stage A -- signed-out shots. No course-29 state. capture.mjs always signs in as
  # `user` before a hook runs, so every shot here uses `signOut: true` to undo that.
  # ---------------------------------------------------------------------------------------

  - id: language-menu
    page: guides/students/login-and-settings
    file: language-menu
    url: /{locale}/
    keepNavbar: true
    hook: hooks/students-interact.mjs
    signOut: true
    openLanguageMenu: true
    highlight:
      - selector: '.dropdown-menu.show' # best-effort: Bootstrap dropdown convention, not confirmed live
    crop:
      clip: { x: 880, y: 0, width: 560, height: 220 } # viewport 1440 wide; dropdown overlays the page
    must_show:
      - globe icon showing the current locale
      - open dropdown listing English / Nederlands
      - highlight box around the open menu
    notes: NAVBAR shot (menu anchors to the navbar corner).

  - id: sign-in-button
    page: guides/students/login-and-settings
    file: sign-in-button
    url: /{locale}/
    keepNavbar: true
    hook: hooks/students-interact.mjs
    signOut: true
    highlight:
      # Selector-based, not text-based: the hero CTA's rendered label is "Try for
      # free" / "Probeer gratis" (app/views/pages/_landing.html.erb `.try_for_free`),
      # not "Sign in" as the manifest assumed -- both link to sign_in_path though,
      # so target them by href/class instead of the stale copy.
      - selector: 'a.sign-in'
        scope: '.dodona-navbar'
      - selector: 'a[href$="/sign_in/"]'
        scope: '#main-container'
    crop:
      clip: { x: 0, y: 0, width: 1440, height: 620 }
    must_show:
      - '"Learn to code" hero'
      - both Sign in affordances highlighted (navbar link + hero button)
      - no dev banner, no environment pill
    notes: >-
      NAVBAR shot. Hero button text is "Try for free" / "Probeer gratis", not "Sign
      in" -- the docs prose ("...the `Sign in` button in the center of the page")
      is stale; flagged for a prose fix, not changed here (out of this chunk's
      authorised scope).

  - id: sign-in-institutions
    page: guides/students/login-and-settings
    file: sign-in-institutions
    url: /{locale}/sign_in/
    hook: hooks/students-interact.mjs
    signOut: true
    crop:
      selector: '#main-container'
    must_show:
      - '"Sign in / Please select your institution..." heading'
      - UGent tile
      - Smartschool + Google Workspace + Office 365 tiles
      - institution search box
      - nothing dev-only (hide #active-announcement, the dev quick-login banner)

  # ---------------------------------------------------------------------------------------
  # Stage B -- novice (user 6), registration + menus. No state changes.
  # ---------------------------------------------------------------------------------------

  - id: homepage-browse-courses
    page: guides/students/courses
    file: homepage-browse-courses
    url: /{locale}/
    user: 6
    crop:
      union: ['a.link-card[href*="/courses/?tab=all"]']
      pad: 24
    css: 'a.link-card[href*="/courses/?tab=all"] { outline: 3px solid #d32f2f; outline-offset: 2px; }'
    must_show:
      - the exact link text the prose quotes ("Browse all courses on Dodona" / Dutch equivalent)

  - id: all-courses
    page: guides/students/courses
    file: all-courses
    url: /{locale}/courses/?tab=all # matches the "Browse all courses" link's own href; the bare
    # /courses/ URL defaults to the Featured-courses tab, which only shows 1 seeded row.
    user: 6
    crop:
      clip: { x: 0, y: 0, width: 1440, height: 700 }
    must_show:
      - tabs (Featured courses / All courses -- "My courses" only appears once the
        reader has joined a course, matching the docs prose "one or more tabs";
        the novice used for this shot has none yet)
      - search field
      - course rows with teacher / institution columns
      - EN UI in the EN shot (the retired file showed the NL UI here -- do not repeat that)

  # Registration callouts (open/moderated/pending/closed) all render through the
  # same partial (app/views/courses/_not_a_member_card.html.erb) into a single
  # Application::CalloutComponent -- a stable `.callout.callout-info` div is the
  # only such callout on a non-member's course page, so crop it directly instead
  # of text-matching the (locale-dependent) prose inside it. No highlight box:
  # the manifest doesn't ask for one on these four.

  - id: registration-open
    page: guides/students/courses
    file: registration-open
    url: /{locale}/courses/29/
    user: 6
    crop:
      selector: '.callout.callout-info'
    must_show:
      - the "not a member of this course" sentence
      - Register button
      - no course description in frame (crop stays tight)

  - id: registration-moderated
    page: guides/students/courses
    file: registration-moderated
    url: /{locale}/courses/3/
    user: 6
    crop:
      selector: '.callout.callout-info'
    must_show:
      - '"registration needs to be approved by a course administrator" sentence'
      - Request registration button
    notes: course 3's own NAME is seeded Dutch -- the tight callout crop keeps it out of frame.

  - id: registration-pending
    page: guides/students/courses
    file: registration-pending
    url: /{locale}/courses/3/
    user: 5 # already `pending` in seeds -- zero state change, do NOT use the novice here
    crop:
      selector: '.callout.callout-info'
    must_show:
      - '"Your registration is pending" sentence'
      - Withdraw registration request button

  - id: registration-closed
    page: guides/students/courses
    file: registration-closed
    url: /{locale}/courses/6/?secret=CeJS2
    user: 6
    crop:
      selector: '.callout.callout-info'
    must_show:
      - '"You are currently not able to subscribe to this course" sentence, exactly, no buttons'

  - id: user-menu-my-profile
    page: guides/students/login-and-settings
    file: user-menu-my-profile
    url: /{locale}/
    user: 6
    keepNavbar: true
    hook: hooks/students-interact.mjs
    openUserMenu: true
    highlight:
      # Selector, not the locale-dependent "My profile"/"Mijn profiel" label: the
      # profile link is the only open-menu item pointing at /users/<id>.
      - selector: 'a[href*="/users/"]'
        scope: '.dropdown-menu.show'
    crop:
      clip: { x: 800, y: 0, width: 640, height: 420 }
    must_show:
      - open menu (My profile / My submissions / My questions / Theme / Sign out)
      - highlight on My profile
    notes: NAVBAR shot.

  # ---------------------------------------------------------------------------------------
  # Stage C -- novice profile shots. One state change (C3), undone at the end.
  # ---------------------------------------------------------------------------------------

  - id: profile-page
    page: guides/students/login-and-settings
    file: profile-page
    url: /{locale}/users/6/
    user: 6
    # No CSS hide needed: the "This account was created manually and can only sign
    # in using this link" token block the manifest warned about (source of the
    # Feb-2025 leak) doesn't exist in the current app -- grepped app/ for
    # token_sign_in/"created manually", zero hits. Feature has been removed since.
    hook: hooks/students-interact.mjs
    highlight:
      # The generic href selector also matches the (hidden, off-by-default) time-zone
      # mismatch banner's "profile page" link earlier in the DOM -- scope by the
      # button's own classes so .first() lands on the visible Edit button.
      - selector: 'a.btn.btn-filled[href$="/edit/"]'
    crop:
      selector: '#main-container'
    must_show:
      - personal info + "Your timezone is set to Brussels." line
      - Edit button highlighted
      - no token sign-in URL visible

  - id: profile-timezone
    page: guides/students/login-and-settings
    file: profile-timezone
    url: /{locale}/users/6/edit/
    user: 6
    # Selector, not the locale-dependent "Time zone"/"Tijdzone" label: :has() picks
    # out the whole form row (app/views/users/_form.html.erb) around the select.
    css: '.field.form-group.row:has(#user_time_zone) { outline: 3px solid #d32f2f; outline-offset: 2px; }'
    crop:
      selector: '#main-container'
    must_show:
      - read-only name/email fields
      - highlighted Time zone row ((GMT+01:00) Brussels select)

  - id: timezone-warning
    page: guides/students/login-and-settings
    file: timezone-warning
    url: /{locale}/
    user: 6
    state: [students-novice-timezone-seoul]
    crop:
      union: ['.alert-warning']
      pad: 16
    must_show:
      - '"Your timezone is currently set to Seoul... change your timezone on your profile page." warning, with the profile-page link visible'

  # ---------------------------------------------------------------------------------------
  # Stage D -- student 5, course 29, EN pass. Stage E repeats this whole block on /nl/...
  # (see the file-level ordering comment). Every entry below implicitly assumes
  # students-series-deadlines is applied; D16 (contact form) is the one exception.
  # ---------------------------------------------------------------------------------------

  - id: recent-exercises
    page: guides/students/exercises
    file: recent-exercises
    url: /{locale}/
    state: [students-series-deadlines]
    crop:
      selector: 'div.card.user:has(.mdi-history)' # Home::RecentExercisesComponent; the DeadlinesComponent
      # ("Upcoming deadlines") reuses the same "card user" class and renders first in the DOM, so a bare
      # `div.card.user` selector's .first() picked the wrong card -- the history icon is unique to this one.
    must_show:
      - eyebrow "Recent exercises"
      - 5 rows with status icons + course subtitle + time-ago
    notes: |
      CORRECTED must_show: the manifest's "warning triangle on the Curling row" and "chevron per
      row" claims don't hold for this component. Home::RecentExercisesComponent renders each row's
      icon via Submissions::StatusIconComponent (plain per-submission correct/wrong, no best-is-not-last
      warning logic -- that logic lives only in app/views/activities/_user_status_icon.html.erb, used
      by the course/series exercise table, see deadline-warning) and Application::CardRowComponent has
      no chevron slot at all. Verified against source and the live capture.

  - id: course-page
    page: guides/students/courses
    file: course-page
    url: /{locale}/courses/29/
    state: [students-series-deadlines]
    crop:
      # This page's content column is .col-md-9 (not .col-md-10, the submission-page
      # grid) and it holds the header card PLUS a per-series card, so a single-selector
      # crop can't fit the must_show list -- union the header card with the first
      # series card instead of clipping a raw viewport rect (that shipped dead
      # margins + a footer sliver).
      # pad 8, not the union default's looser sibling values elsewhere: the
      # series-sidebar column starts only 12px right of the card's right edge,
      # so anything wider clips a sliver of its "PART 1" heading into frame.
      union: ['.col-md-9 > .card', '.card.series']
      pad: 8
    must_show:
      - course header (title, teacher, description, Unregister row)
      - at least one series card
      - not-yet-passed deadline under the series name
      - status column with correct/wrong icons
    notes: |
      CORRECTED must_show: the manifest called this a "green (not-expired) deadline" but
      Series::DeadlineComponent#html_class only uses "deadline-ok" (var(--d-success), green) when
      the reader completed the series BEFORE a deadline that has since PASSED (met: true). A future,
      not-yet-passed deadline gets "deadline-future" (var(--d-on-surface-muted), gray) -- verified
      against app/assets/stylesheets/models/series.css.scss and the live capture. The green case is
      Stage F's icon-course-deadline-met crop, not this shot.

  - id: course-breadcrumb
    page: guides/students/courses
    file: course-breadcrumb
    url: /{locale}/courses/29/series/141/activities/369972474/
    state: [students-series-deadlines]
    keepNavbar: true
    hook: hooks/students-interact.mjs
    highlight:
      - text: { en: 'Programming 1', nl: 'Programmeren 1' }
        scope: '.dodona-navbar'
    crop:
      clip: { x: 0, y: 0, width: 1440, height: 64 }
    must_show:
      - '"Dodona | Programming 1 > Conditions > Curling" crumb (nl: "Programmeren 1 > Voorwaarden > Curling"), course name highlighted'
    notes: NAVBAR shot. Same URL as exercise-breadcrumb (D8) -- shoot both from one page load if driving the browser by hand.

  - id: deadline-warning
    page: guides/students/courses
    file: deadline-warning
    url: /{locale}/courses/29/
    state: [students-series-deadlines]
    hook: hooks/students-interact.mjs
    highlight:
      - rowText: 'Curling'
        selector: '.mdi-alert'
        scope: '#series-card-141' # Series::CardComponent id: "series-card-#{series.id}" (verified in app/components/series/card_component.html.erb)
    crop:
      selector: '#series-card-141'
    must_show:
      - series deadline visible
      - Curling row "Wrong" status + warning triangle
      - other rows for context

  - id: course-exercise-selection
    page: guides/students/exercises
    file: course-exercise-selection
    url: /{locale}/courses/29/
    state: [students-series-deadlines]
    # Use `border`, not `outline`: this page renders every candidate outline (on
    # .activity-table, .table-scroll-wrapper, .series-activities-table-wrapper, even
    # #series-card-140 itself) invisible on 3 of 4 sides -- verified live, root cause not fully
    # pinned down (some ancestor's stacking/paint order swallows it) -- while a `border` on the
    # same element renders correctly, since overflow clips content at the padding edge, never the
    # element's own border. Border on the table-adjacent wrapper div, not the table (border-collapse
    # would otherwise merge it into the header row).
    css: '.series-activities-table-wrapper { border: 3px solid #d32f2f; border-radius: 6px; }'
    crop:
      selector: '#series-card-140' # Series::CardComponent id: "series-card-#{series.id}" (verified, see deadline-warning)
    must_show:
      - numbered exercise rows with language icons
      - class progress bars
      - Status column

  - id: course-unregister
    page: guides/students/courses
    file: course-unregister
    url: /{locale}/courses/29/
    state: [students-series-deadlines]
    hook: hooks/students-interact.mjs
    # ancestor: '.card', not the default 'div' -- the Unregister button's closest 'div' is just
    # its own .card-actions row (verified live), too tight to show any "course card context".
    # Its closest '.card' is the whole course header card (title, description, actions row).
    tagClosest:
      - { name: unregister-row, text: { en: 'Unregister', nl: 'Uitschrijven' }, ancestor: '.card' }
    crop:
      selector: '[data-shot="unregister-row"]'
    must_show:
      - course card context (title, description)
      - highlighted Unregister/Uitschrijven link

  - id: exercise-page
    page: guides/students/exercises
    file: exercise-page
    url: /{locale}/courses/29/series/140/activities/347592237/
    state: [students-series-deadlines]
    hook: hooks/students-interact.mjs
    iframeProfilerFix: true
    # Union of the two cards: #main-container also includes the right-hand series
    # sidebar (clipped mid-word at this viewport) and lets the fixed legacy submit
    # FAB bleed into the frame.
    crop:
      union: ['.card.activity-description', '.card.card-nav']
    must_show:
      - exercise title header
      - description
      - code editor
