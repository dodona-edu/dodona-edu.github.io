  - id: saved-comments-search
    page: faq/annotations
    file: saved-comments-search
    url: http://dodona.localhost:3000/{locale}/courses/29/
    user: 1 # zeus
    state: [faq-cast, faq-annotated-submission, faq-annotations-content]
    hook: hooks/faq-saved-comments-search.mjs
    crop:
      selector: .code-listing-container
    must_show:
