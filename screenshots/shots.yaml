# Assessments-guide shot manifest (Phase 5 item 1: en/nl guides/teachers/assessments).
# NOTHING in this section has been captured yet -- the guide ships text-first and reuses
# the existing ESM-1 series-form image for the kind chooser. Assessment mode is behind
# the `exam_mode` Flipper flag, so every shot needs a state scenario that enables the
# flag AND builds an exam series; none of those scenarios exist yet:
#
#   assessments-exam-series    (to be written) enable the exam_mode Flipper flag for
#                              user 1, add an exam series to course 11 with
#                              activity_access: password, exam_lockdown_mode: true,
#                              a future deadline and exam_auto_close: true, no sessions.
#   assessments-exam-sessions  (to be written) on top of the above: a few students with
#                              started sessions, a few stopped (one stopped_by teacher,
#                              one handed in by the student), the rest not started, plus
#                              the exam log rows those create -- drives ASSESS-3/4.
#   assessments-exam-over      (to be written) all sessions stopped, exam_released
#                              false -- drives ASSESS-5's "Publish assessment" button.
#
# The exam series only gets an id when its scenario first runs, and that id is not a
# stable fixture the way series 51-54/140/141/52 are: assessments-exam-series.teardown.rb
# destroys the series again at the end of the capture chunk (course 11 needs to come
# back clean), so a hardcoded id would go stale the next time this manifest is used to
# recapture these shots. Same handoff as `dynamicSubmission` in students-interact.mjs:
# the setup script writes the id to the shared JSON state file
# (/tmp/dodona-docs-capture-state.json) and hooks/assessments.mjs reads it, navigating to
# the real per-shot URL and substituting the `{seriesId}` token below into crop.selector.

defaults:
  user: 1
  hook: hooks/assessments.mjs

shots:
  - id: ASSESS-1
    page: guides/teachers/assessments
    file: assessment-options
    url: /{locale}/courses/11/ # placeholder; the hook navigates to the real series edit URL
    state: [assessments-exam-series]
    crop:
      selector: '#exam_mode_section'
    must_show:
      - '"Assessment options" heading'
      - Require a password to start the assessment checkbox (checked) + Password field
      - Restrict Dodona to assessment content checkbox (checked)
      - Automatically stop assessment sessions checkbox (checked)

  - id: ASSESS-2
    page: guides/teachers/assessments
    file: assessment-start
    url: /{locale}/courses/11/
    user: 5
    state: [assessments-exam-series]
    crop:
      selector: '#series-card-{seriesId}'
    must_show:
      - '"How this assessment works" callout with the four/five explanation items'
      - academic-integrity logging notice
      - password input ("Enter password") + Start assessment button
      - no exercise list visible on the card

  - id: ASSESS-3
    page: guides/teachers/assessments
    file: assessment-overview
    url: /{locale}/courses/11/ # placeholder; the hook navigates to the real assessment_overview URL
    state: [assessments-exam-series, assessments-exam-sessions]
    viewport: { width: 1600, height: 1500 }
    crop:
      selector: '#main-container .card'
    must_show:
      - status panel (Status/Dodona access/Password/Auto-stop rows, Show button)
      - Not yet started / In progress / Stopped counter cards with nonzero counts
      - Timeline callout with View full timeline button
      - Stop sessions action next to the search bar
      - sessions table with Started at/Stopped at values, per-row stop/reopen/timeline
        buttons and a "Closed before starting" row

  - id: ASSESS-4
    page: guides/teachers/assessments
    file: assessment-timeline
    url: /{locale}/courses/11/ # placeholder; the hook navigates to the real exam_logs URL
    state: [assessments-exam-series, assessments-exam-sessions]
    crop:
      selector: '#main-container .card'
    must_show:
      - Timestamp / Action / Actor columns
      - a mix of event types (Assessment started, Submitted solution ..., Assessment
        stopped with a teacher actor, one System actor row if auto-stop fired)
      - User/Action/Actor/IP address/Browser filter dropdowns
      - Export button

  - id: ASSESS-5
    page: guides/teachers/assessments
    file: assessment-publish
    url: /{locale}/courses/11/
    state: [assessments-exam-series, assessments-exam-over]
