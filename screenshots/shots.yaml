# Teacher-guide shot manifest (Phase 4 re-shoot, 2026-07-31).
#
# All 36 shots below were actually captured (course 11 "Visualisation Test",
# zeus/user 1). CM-7 (dolos) was skipped: clicking "Detect plagiarism" needs a
# real export job plus a live call to the external Dolos service, and this
# dev instance has no background job worker, so the click hangs forever. It
# stays a manual capture; see its `manual: true` entry at the end of
# course-management.
#
# State scenarios used below (bin/rails runner in the dodona checkout):
#   course11-naming[.rb nl]      course 11 + series 51-54 renamed off their
#                                 seeded lorem names; pass "nl" for the NL pass
#   course11-labels               seeds the 5a/5b member labels (course 11 has
#                                 none by default)
#   eval1-score-items[.rb nl]    renames evaluation 1's score items off their
#                                 seeded lorem names; pass "nl" for the NL pass
#   series-visibility              (SS-1 only) three series get non-default
#                                 visibilities at once
#   grading-wizard-series52       keeps series 52 evaluation-free so the
#                                 G-1..G-6 wizard shots start clean
#
# course11-naming and eval1-score-items are locale-parameterized (one scenario,
# run once per pass) because a single shot id is captured for both locales but
# the `state:` list itself isn't locale-aware — run the matching setup.rb
# (bare, or with an "nl" argument) before each `--locale` pass.

