# Shots for the AI draft answers FAQ entries (en+nl faq/annotations: "How do AI draft
# answers work?" and "How do I enable or disable AI draft answers?"). Captured 2026-08;
# wired into both locales of that page.
#
# State: state/question-with-draft.setup.rb seeds a global Question from Sofie (user
# 5) plus a directly-created, realistic-looking LlmResponse (not the dev placeholder)
# on Submission 1206 -- an already-judged, annotation-free, stable seeded fixture on
# course 11, so no dynamic-id handoff is needed; the url below points straight at it.
# hooks/ai-draft-answer.mjs drives the reply-form interaction (open it, and for AI-2
# rate it) that a plain goto() can't.

shots:
  - id: AI-1
    page: faq/annotations
    file: draft-answer-suggested
    url: /{locale}/submissions/1206/#code
    state: [course11-naming, question-with-draft]
    hook: hooks/ai-draft-answer.mjs
    # Open the reply form on the question thread first: click the fake reply
    # input under the question (placeholder shows a sparkle: "✨Reply...").
    # The form opens prefilled with the draft only while no teacher reply
    # exists yet (thread.firstResponse()).
    crop:
      selector: 'd-thread'
      pad: 8
    must_show:
      - the student's question in the thread
      - sparkle (mdi-creation) icon + "Suggested answer - Rate suggestion:" label above the text box
      - thumbs up / thumbs down rating buttons (outline state, not yet rated)
      - reply text box prefilled with the generated draft text
      - Reply / Cancel buttons

  - id: AI-2
    page: faq/annotations
    file: draft-answer-rated
    url: /{locale}/submissions/1206/#code
    state: [course11-naming, question-with-draft]
    hook: hooks/ai-draft-answer.mjs
    # Same form as AI-1, after clicking the thumbs-up button: the icon fills
    # (mdi-thumb-up) and the optional comment input appears and takes focus.
    crop:
      selector: 'd-thread'
      pad: 8
    must_show:
      - filled thumbs-up icon (rated "good")
      - comment input with placeholder "Explain your rating (optional)..."

  - id: AI-3
    page: faq/annotations
    file: draft-answers-toggle
    url: /{locale}/courses/11/edit
    state: [course11-naming]
    # Crop to the "Questions" field group of the course edit form
    # (app/views/courses/_form.html.erb): the questions_enabled checkbox row
    # plus the draft_answers_enabled row and its help block below it.
    crop:
      union: ['.course-draft-disabled:has(#course_questions_enabled)', '.course-draft-disabled:has(#course_draft_answers_enabled)']
      pad: 8
    must_show:
      - '"Questions" label with checkbox "Allow students to ask questions" (checked)'
      - checkbox "Automatically propose a response to student questions" (checked)
      - help text "Use an LLM to generate a draft response to questions. Students never see the draft; it's only a suggestion for your reply."

